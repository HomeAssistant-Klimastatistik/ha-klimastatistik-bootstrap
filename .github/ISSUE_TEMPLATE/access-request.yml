name: Zugang zu HA Klimastatistik anfordern
description: Zugang zur privaten Distribution für eine Neuinstallation oder das Update einer bestehenden Installation anfordern.
title: "Zugangsanfrage: "
labels:
  - access-request
assignees:
  - sh-2508
body:
  - type: markdown
    attributes:
      value: |
        ## Zugang zu HA Klimastatistik

        HA Klimastatistik wird derzeit privat verteilt.

        Dieses Formular ist für eine Neuinstallation von HA Klimastatistik 3.x
        oder für das Update einer bestehenden HA-Klimastatistik-Installation
        aus der Reihe v2.2.x vorgesehen.

        Die Anfrage selbst ist öffentlich sichtbar. Bitte hier keine
        E-Mail-Adressen, Zugangsdaten, Tokens oder andere private Informationen
        veröffentlichen.

  - type: dropdown
    id: installation_status
    attributes:
      label: Installationsart oder aktuell installierte Version
      description: Wähle eine Neuinstallation oder die derzeit installierte HA-Klimastatistik-Version aus.
      options:
        - "Neuinstallation von HA Klimastatistik 3.x (keine vorhandene Installation)"
        - "2.2.2"
        - "2.2.3"
        - "Andere Version aus der Reihe 2.2.x"
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Bestätigung
      options:
        - label: Ich möchte Zugang zur privaten HA-Klimastatistik-Distribution für eine Neuinstallation oder das Update meiner bestehenden Installation erhalten.
          required: true
        - label: Mir ist bekannt, dass diese Zugangsanfrage als öffentliches GitHub-Issue sichtbar ist.
          required: true
        - label: Ich werde keine Tokens, Zugangsdaten oder anderen vertraulichen Informationen in diesem Issue veröffentlichen.
          required: true
